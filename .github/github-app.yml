# GitHub Copilot App configuration
# Copilot Appのセッション開始時に依存関係をインストールし、
# Next.jsの開発サーバーを起動してintegrated browserで自動的に開く

name: NextToCopilotApp

# リポジトリ作成時・セッション開始時のセットアップ
setup:
  steps:
    - name: Install dependencies
      run: npm ci

# 開発サーバーの起動設定
start:
  command: npm run dev
  # Next.jsのdevサーバーが待ち受けるポート
  port: 3000
  # サーバー起動完了の検出（Next.jsが標準出力に出すURL/Readyメッセージ）
  readiness:
    type: log
    pattern: "Local:\\s+http://localhost:(\\d+)"

# integrated browserの自動起動設定
browser:
  autoOpen: true
  url: http://localhost:3000
